<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو توليد الفيديوهات الذكية</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #38bdf8; font-size: 1.4rem; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 6px; font-size: 0.9rem; color: #94a3b8; }
        textarea, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        textarea { resize: vertical; min-height: 90px; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .output { margin-top: 24px; padding: 16px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; display: none; text-align: center; }
        .status { color: #38bdf8; font-size: 0.95rem; margin-bottom: 12px; }
        video { width: 100%; border-radius: 8px; margin-top: 10px; display: none; background: #000; }
        .download-btn { display: none; margin-top: 12px; background: #10b981; text-decoration: none; padding: 10px; border-radius: 8px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>استوديو توليد الفيديوهات الذكية</h1>
    
    <label>وصف المشهد الإعلاني (Prompt):</label>
    <textarea id="prompt" placeholder="اكتب تفاصيل المشهد بالإنجليزية للحصول على أفضل جودة..."></textarea>

    <label>الأبعاد (Aspect Ratio):</label>
    <select id="ratio">
        <option value="9:16">9:16 (عمودي - Reels / TikTok / Shorts)</option>
        <option value="16:9">16:9 (أفقي - YouTube / شاشات)</option>
        <option value="1:1">1:1 (مربع - Instagram Post)</option>
    </select>

    <button id="submitBtn" onclick="generateVideo()">بدء إنشاء الفيديو</button>

    <div class="output" id="outputBox">
        <p class="status" id="statusText">جاري معالجة الطلب...</p>
        <video id="videoPlayer" controls playsinline></video>
        <a id="downloadLink" class="download-btn" target="_blank" download="video.mp4">تحميل الفيديو</a>
    </div>
</div>

<script>
    async function generateVideo() {
        const prompt = document.getElementById('prompt').value.trim();
        const ratio = document.getElementById('ratio').value;
        const outputBox = document.getElementById('outputBox');
        const statusText = document.getElementById('statusText');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const submitBtn = document.getElementById('submitBtn');

        if (!prompt) {
            alert('يرجى كتابة وصف المشهد أولاً');
            return;
        }

        outputBox.style.display = 'block';
        videoPlayer.style.display = 'none';
        downloadLink.style.display = 'none';
        submitBtn.disabled = true;
        statusText.innerText = 'جاري إرسال الطلب ومعالجة الفيديو بالذكاء الاصطناعي...';

        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, ratio })
            });
            const data = await res.json();

            if (data.success && data.videoUrl) {
                statusText.innerText = 'تم إنشاء الفيديو بنجاح!';
                videoPlayer.src = data.videoUrl;
                videoPlayer.style.display = 'block';
                downloadLink.href = data.videoUrl;
                downloadLink.style.display = 'inline-block';
            } else {
                statusText.innerText = data.message || data.error || 'تم استلام الرد بنجاح!';
            }
        } catch (err) {
            statusText.innerText = 'فشل الاتصال بالسيرفر. تأكد من إعداد المفاتيح والاتصال.';
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
